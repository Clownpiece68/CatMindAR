	  <!-- CSS THINGS -->
	<style>
	@font-face {
        font-family: "bodyFont";
        src: url("./AustieBostKittenKlub.ttf");
    }

	#main-ui {
        display: none;
        }
		
	#start-button {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		font-family: "bodyFont";
		padding: 12px 24px; 
        font-size: 24px;
        }
	</style>
	  
  </head>

	
  <body>

    <!-- UI -->
    <div id="start-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;">
        <button id="start-button">Start</button>
    </div>

	  
    <div id="main-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;">
			<button id="next-button">next</button>
		    <button id="previous-button">previous</button>
	</div>

    <!-- AR STUFF -->
    <a-scene mindar-image="imageTargetSrc: ./Oiiaii.mind; autoStart: false; maxTrack: 2" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" >
      <a-assets>
        <a-asset-item id="oiioiiAsset" src="./Oiiiaii_Cat.gltf"></a-asset-item>
        <a-asset-item id="maxwellAsset" src="./Maxwell.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
          <a-gltf-model rotation="0 0 0 " position="0 -0.25 0" scale="0.02 0.02 0.02" src="#oiioiiAsset" id="oiioiiModel" 
            animation__spin="property: rotation; to: 0 360 0; dur: 500; easing: linear; loop: true" 
            animation__position="property: position; to: 0 0.25 0; dur: 500; easing: easeInOutQuad; loop: true; dir: alternate">
          </a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
          <a-gltf-model rotation="0 -60 0 " position="0 -0.40 0" scale="0.035 0.035 0.035" src="#maxwellAsset" id="maxwellModel" 
            animation__spin="property: rotation; to: 25 -60 0; from: -25 -80 0; dur: 500; easing: easeInOutQuad; loop: true; dir: alternate" >
          </a-gltf-model>
      </a-entity>  
    </a-scene>

  </body>
</html>
