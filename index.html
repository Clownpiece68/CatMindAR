
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

	      <!-- JAVA SHIT -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
	    const sceneEl = document.querySelector('a-scene');
	    let arSystem;
	  sceneEl.addEventListener('loaded', function () {
	    arSystem = sceneEl.systems["mindar-image-system"];
      });
		  
	  const startButton = document.querySelector("#start-button");

	  startButton.addEventListener('click', () => {
	      arSystem.start();
		  startButton.style.display = 'none';
		  console.log("Botoncito picado uwu");
	  });
	});
    </script>

	  
	  <!-- CSS THINGS -->
	<style>
	#start-button {
		position: absolute;
		top: 50%;
		left: 50%;
        }
	</style>
	  
  </head>

	
  <body>

    <!-- UI -->
    <div style="position: absolute; z-index: 1000" top: 0; left: 0; width: 100%; height: 100%;>
        <button id="start-button">Start</button>
    </div>

    <!-- AR STUFF -->
    <a-scene mindar-image="imageTargetSrc: ./Oiiaii.mind; autoStart: false; maxTrack: 2" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" >
      <a-assets>
        <a-asset-item id="oiioiiModel" src="./Oiiiaii_Cat.gltf"></a-asset-item>
        <a-asset-item id="maxwellModel" src="./Maxwell.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
          <a-gltf-model rotation="0 0 0 " position="0 -0.25 0" scale="0.02 0.02 0.02" src="#oiioiiModel" 
            animation__spin="property: rotation; to: 0 360 0; dur: 500; easing: linear; loop: true" 
            animation__position="property: position; to: 0 0.25 0; dur: 500; easing: easeInOutQuad; loop: true; dir: alternate">
          </a-gltf-model>
      </a-entity>
      
      <a-entity mindar-image-target="targetIndex: 1">
          <a-gltf-model rotation="0 -60 0 " position="0 -0.40 0" scale="0.035 0.035 0.035" src="#maxwellModel" 
            animation__spin="property: rotation; to: 25 -60 0; from: -25 -80 0; dur: 700; easing: easeInOutQuad; loop: true; dir: alternate" >
          </a-gltf-model>
      </a-entity>  
    </a-scene>

  </body>
</html>
